name: Continuous Testing

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]

jobs:
  happy-path:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, frontend]
    defaults:
      run:
        working-directory: auto-service/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auto-service/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run test:happy

  full-suite:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, frontend]
    defaults:
      run:
        working-directory: auto-service/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auto-service/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run test:full
